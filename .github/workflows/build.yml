name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  linux-tests:
    name: Tests (Linux)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Abhängigkeiten
        run: sudo apt-get update && sudo apt-get install -y libspandsp-dev libtiff-dev ghostscript
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: faxshim bauen
        run: make -C native/faxshim
      - name: Tests
        run: dotnet test tests/FaxDrucker.Tests -c Release --logger "console;verbosity=normal"

  windows:
    name: Windows-Paket
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-libtiff
            mingw-w64-x86_64-pkgconf
            autoconf automake libtool make git

      - name: spandsp + faxshim.dll bauen
        shell: msys2 {0}
        run: bash native/build-windows.sh

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Ghostscript für Tests
        run: choco install ghostscript -y --no-progress

      - name: Tests (Windows)
        run: dotnet test tests/FaxDrucker.Tests -c Release --logger "console;verbosity=normal"

      - name: Veröffentlichen
        shell: pwsh
        run: |
          $out = "dist/FaxDrucker"
          $ver = "0.2.$env:GITHUB_RUN_NUMBER"
          dotnet publish src/FaxDrucker.App -c Release -r win-x64 --self-contained true -o $out -p:Version=$ver
          dotnet publish src/FaxDrucker.Cli -c Release -r win-x64 --self-contained true -o $out -p:Version=$ver
          Copy-Item installer/*.ps1, installer/*.cmd $out
          Copy-Item README.md $out/LIESMICH.md
          Get-ChildItem $out -Filter *.pdb | Remove-Item

      - name: Selbsttest des Pakets
        shell: pwsh
        run: dist/FaxDrucker/faxsend.exe selbsttest

      - name: MSI bauen
        shell: pwsh
        run: |
          $ver = "0.2.$env:GITHUB_RUN_NUMBER"
          $pub = (Resolve-Path dist/FaxDrucker).Path
          dotnet build installer/msi/FaxDrucker.wixproj -c Release -p:FaxPublishDir=$pub -p:Version=$ver -o dist/msi
          Get-ChildItem dist/msi

      - name: MSI testweise installieren und entfernen
        shell: pwsh
        run: |
          $msi = (Get-ChildItem dist/msi/*.msi | Select-Object -First 1).FullName
          # Ungültiger Lizenzschlüssel muss die Installation abbrechen und alles zurückrollen
          $p = Start-Process msiexec.exe -ArgumentList "/i `"$msi`" /qn FAXDRUCKER_NOSTART=1 LICENSEKEY=FD1-UNGUELTIG /l*v `"$PWD\badkey.log`"" -Wait -PassThru
          if ($p.ExitCode -eq 0) { throw 'Installation mit ungültigem Lizenzschlüssel hätte fehlschlagen müssen' }
          if (Get-Printer -Name FaxDrucker -ErrorAction SilentlyContinue) { throw 'Drucker nach Rollback noch vorhanden' }
          if (Test-Path "$env:ProgramFiles\FaxDrucker\FaxDrucker.exe") { throw 'Dateien nach Rollback noch vorhanden' }
          Write-Host "Ungültiger Schlüssel korrekt abgelehnt (Exitcode $($p.ExitCode))"
          $p = Start-Process msiexec.exe -ArgumentList "/i `"$msi`" /qn FAXDRUCKER_NOSTART=1 /l*v `"$PWD\install.log`"" -Wait -PassThru
          if ($p.ExitCode -ne 0) { Get-Content install.log -Tail 80; throw "Installation fehlgeschlagen: $($p.ExitCode)" }
          Select-String -Path install.log -Pattern 'WixQuietExec' | Select-Object -Last 15 | ForEach-Object { $_.Line }
          $printer = Get-Printer -Name FaxDrucker
          $printer | Format-List Name, DriverName, PortName
          if ($printer.PortName -ne '\\.\pipe\FaxDrucker') { throw "Falscher Anschluss: $($printer.PortName)" }
          if (-not (Test-Path "$env:ProgramFiles\FaxDrucker\FaxDrucker.exe")) { throw 'FaxDrucker.exe fehlt' }
          & "$env:ProgramFiles\FaxDrucker\faxsend.exe" selbsttest
          if ($LASTEXITCODE -ne 0) { throw 'Selbsttest nach Installation fehlgeschlagen' }
          $p = Start-Process msiexec.exe -ArgumentList "/x `"$msi`" /qn /l*v `"$PWD\uninstall.log`"" -Wait -PassThru
          if ($p.ExitCode -ne 0) { Get-Content uninstall.log -Tail 80; throw "Deinstallation fehlgeschlagen: $($p.ExitCode)" }
          if (Get-Printer -Name FaxDrucker -ErrorAction SilentlyContinue) { throw 'Drucker nach Deinstallation noch vorhanden' }
          if (Test-Path "$env:ProgramFiles\FaxDrucker\FaxDrucker.exe") { throw 'Programmdateien nach Deinstallation noch vorhanden' }
          Write-Host 'Installation und Deinstallation OK'

      - uses: actions/upload-artifact@v4
        with:
          name: FaxDrucker-msi
          path: dist/msi/*.msi

      - uses: actions/upload-artifact@v4
        with:
          name: FaxDrucker-win-x64
          path: dist/FaxDrucker

      - name: Lizenzgenerator (nur für den Herausgeber)
        shell: pwsh
        run: dotnet publish tools/FaxDrucker.Lizenzgenerator -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o dist/Lizenzgenerator

      - uses: actions/upload-artifact@v4
        with:
          name: Lizenzgenerator-NICHT-WEITERGEBEN
          path: dist/Lizenzgenerator
